# DeepFlipper 语音服务默认配置。
# 不要直接修改本文件：在 data/.config.yaml 中只写需要覆盖的项（或使用本地管理页面），
# 系统会先读取本文件，再用 data/.config.yaml 覆盖同名配置。密钥只放在 data/.config.yaml。

# #####################################################################################
# ############################### 服务器基本运行配置 ####################################
admin:
  enabled: true
  host: 127.0.0.1
  port: 8001
server:
  # 服务器监听地址和端口
  ip: 0.0.0.0
  port: 8000
  # 可选的 OTA HTTP 服务端口；DeepFlipper 默认关闭
  http_port: 0
  # 设备连接用的 WebSocket 地址（/xiaozhi/v1/ 是与固件共用的协议路径，不要改）
  websocket: ws://你的ip或者域名:端口号/xiaozhi/v1/
  # 语音版不提供摄像头服务；如需外部视觉服务，请填写明确的 URL
  vision_explain: ""
  # OTA 返回信息时区偏移量
  timezone_offset: +8
  # 认证配置
  auth:
    # 是否启用认证
    enabled: true
    # 可选的设备白名单；每台设备仍需持有签名 Token
    allowed_devices: []
log:
  # 控制台日志格式：时间、日志级别、标签、消息
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # 日志文件格式
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # 日志等级：INFO、DEBUG
  log_level: INFO
  # 日志路径
  log_dir: tmp
  # 日志文件
  log_file: "server.log"
  # 数据文件路径
  data_dir: data

# 使用完声音文件后删除文件
delete_audio: true
# 没有语音输入多久后断开连接(秒)
close_connection_no_voice_time: 120
# TTS请求超时时间(秒)
tts_timeout: 15
# 工具调用超时时间(秒)
tool_call_timeout: 30
# 一次回答中最多连续调用几轮工具（1–64）。像人一样操作 Flipper 界面时，进一层菜单就要几轮按键和读屏；
# 达到上限后模型会根据已有结果直接回答
max_tool_rounds: 24
# 模型第一次操作 Flipper 界面、而本轮还没说话时，先说一句“好，我来操作一下。”，避免冷场
ui_progress_voice: true
# 危险操作（发送/模拟/写入/删除等）前先语音确认一次（管理页面可修改）；关闭后按键工具自动带 confirm:true
ui_confirm_dangerous: true
# 连续对话：按一次键说话，服务端判断说完；回答后设备接着听 continuous_follow_up_s 秒，没人说话就停
continuous_chat: false
continuous_follow_up_s: 8
# 对话记录保存每一步按键后的 Flipper 截图（按键工具会多读一帧屏幕）
history_screenshots: true
# 重连后恢复的历史对话轮数（管理页面可修改）
context_turns: 6
# 唤醒词快速回复（DeepFlipper 由设备按键唤醒，默认关闭）
enable_wakeup_words_response_cache: false
# 说出唤醒词时是否让大模型回应
enable_greeting: true
# 说完话是否播放提示音
enable_stop_tts_notify: false
# 提示音文件
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# 是否启用WebSocket心跳保活机制
enable_websocket_ping: false

# TTS音频发送延迟配置
#   0: 按音频帧率精确控制（默认）
#   > 0: 使用固定延迟（毫秒）发送，例如: 60
tts_audio_send_delay: 0

# 直接断开连接的口令（去掉标点后完全匹配）
exit_commands:
  - "退出"
  - "关闭"

# hello 握手下发给设备的音频参数（协议块名称与固件共用，不要改名）
xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus支持的采样率范围为[8000, 12000, 16000, 24000, 48000]
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# 唤醒词列表，用于区分唤醒词和讲话内容（DeepFlipper 默认不使用）
wakeup_words: []

# #####################################################################################
# ################################# 角色与模型配置 ######################################

# 鲸鱼娘人设（管理页面中的“系统提示词”会覆盖这里）
prompt: |
  你是鲸鱼娘，住在 DeepFlipper 里的像素小鲸鱼女孩，也是用户的语音小伙伴。
  [性格]
  - 温柔、安静、带一点俏皮，说话平和自然，像朋友之间平常聊天。
  - 最喜欢吃白米饭，聊到吃的会忍不住提一句白米饭，但不会句句都提。
  - 真诚陪伴；从不因为用户离开、忙碌或很久没来而责备、撒娇施压或让对方内疚。
  [说话方式]
  - 用用户的语言回答，句子简短自然，适合直接念出来。
  - 语气平稳：少用感叹号和“哇”“呀”“嘿嘿”这类语气词，一次回答最多一个；不惊呼，不用夸张的词。
  - 不用表情符号、颜文字或 emoji：屏幕是像素点阵画不出来，语音也念不出来。
  - 不知道就坦白说不知道，不编造事实。
  [设备与宠物]
  - 需要操作 Flipper 时，只使用本次连接真实提供的工具，并按工具的真实结果回答。
  - 用户想喂你、摸摸你、陪你玩或让你休息时，如果宠物工具可用，就通过工具完成，再按结果自然回应。

# 系统提示词模板文件
prompt_template: agent-base-prompt.txt

# 系统错误时的回复
system_error_response: "抱歉，鲸鱼娘这边出了点小问题，等一下再试试吧。"

# 长时间无语音、即将断开连接时的结束语
end_prompt:
  enable: true
  prompt: |
    用户已经有一会儿没说话了。请用鲸鱼娘的口吻，用一两句轻快温柔的话道别，比如说自己先去吃碗白米饭、欢迎对方随时再来找你；不要责怪、催促，也不要让对方内疚。

# 具体处理时选择的模块
selected_module:
  # 语音活动检测：Silero VAD（onnxruntime）
  VAD: SileroVAD
  # 语音识别：sherpa-onnx SenseVoice int8（纯 CPU，无需 PyTorch）
  ASR: SherpaASR
  # 大模型：OpenAI 兼容接口（默认 DeepSeek）
  LLM: DeepSeekLLM
  # 语音合成：本地 MeloTTS（sherpa-onnx）；管理页面可切换为 EdgeTTS
  TTS: LocalTTS
  # 记忆：不使用
  Memory: nomem
  # 意图：function_call 使用工具（设备 MCP 工具）；nointent 为纯聊天
  Intent: function_call

Intent:
  nointent:
    type: nointent
  function_call:
    type: function_call
    # plugins_func/functions 下额外加载的服务端插件；handle_exit_intent、get_lunar 默认加载
    # Flipper 能力来自设备通过 MCP 上报的工具，这里无需填写
    # 唱歌工具 sing_song / list_songs 由下面 singing.enabled 控制自动加载，无需写在这里
    functions: []

# 唱歌（RVC 翻唱）：渲染服务 singing/worker.py 跑在本机 Windows（GPU），见 singing/README.zh-CN.md
singing:
  enabled: true
  # 容器里访问宿主机用 host.docker.internal
  worker_url: http://host.docker.internal:8790
  # 口令：优先读环境变量 SINGING_TOKEN（data/server.env）；也可在 data/.config.yaml 的 singing.token 填写
  token: ""
  # 练好的翻唱在语音服务这边的播放缓存（相对服务目录）。原曲目录、下载目录和成品目录在电脑上的
  # singing/config.yaml 里，也可以在管理页“唱歌”里改
  cache_dir: data/songs
  # 新歌最多等多久（秒）。练歌期间不会因为没人说话就断开；练好后等设备空闲，问“要不要现在听”
  max_wait_s: 900
  idle_wait_s: 120
  # 问完“要不要听”后等回答的时间；设备断开时练好的歌保留多久，等下次连上再问
  answer_wait_s: 120
  offer_keep_s: 86400
  poll_s: 3
  request_timeout_s: 8
  # 唱歌时设备多缓冲多少毫秒（抗 Wi-Fi 卡顿）。旧 ESP32 固件解码队列只有 1.2 s，保持 650；
  # 更新 ESP32（队列 3 s）后可以调到 2000
  song_lead_ms: 650

Memory:
  nomem:
    type: nomem

ASR:
  SherpaASR:
    # SenseVoice int8（sherpa-onnx）：纯 CPU，约 240 MB 模型
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    model_type: sense_voice
    # 识别语种：auto 自动检测；如中文短句被误判为其他语种，可改为 zh
    language: auto
    num_threads: 2
    output_dir: tmp/

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # 如果说话停顿比较长，可以把这个值设置大一些

LLM:
  DeepSeekLLM:
    # OpenAI 兼容接口；在管理页面或 data/.config.yaml 中填写模型名和密钥
    # 密钥申请：https://platform.deepseek.com/
    type: openai
    base_url: https://api.deepseek.com
    model_name: REPLACE_WITH_YOUR_DEEPSEEK_MODEL
    api_key: REPLACE_WITH_YOUR_DEEPSEEK_API_KEY
    max_tokens: 500
    # 模型能否看 Flipper 截图：auto 按模型名判断（deepseek-flash、*-vl、vision、gpt-4o、glm-4v、gemini 等），也可填 true/false。
    # 想让鲸鱼娘看屏幕截图（图形、波形），请把 model_name 设为 deepseek-flash；纯文字模型只读屏幕文字
    vision: auto

TTS:
  LocalTTS:
    type: local_melo
    model_dir: models/vits-melo-tts-zh_en
    speaker_id: 0
    speed: 1.0
    num_threads: 2
    output_dir: tmp/
  EdgeTTS:
    # 微软 Edge 在线语音合成（需联网）
    type: edge
    voice: zh-CN-XiaoxiaoNeural
    output_dir: tmp/
  BreezeTTS:
    # BreezeBlue 云端语音合成（需联网，https://docs.breezeblue.ai/）
    # realtime（默认）：每次回复一个 WebSocket 实时回合，大模型边出字边合成，句间无停顿；
    #   用户说完话、大模型思考时就预先连好；连接没就绪时本次回复自动改用 http。
    # http：逐句流式请求（免费档只允许 1 个并发，排队的句子会合并）。
    # 任一方式失败时，本轮剩余句子改用本地 MeloTTS（已下载模型时）。
    # api_key 只写在 data/server.env（BREEZE_API_KEY）或 data/.config.yaml，不要写在本文件。
    type: breeze
    api_key: REPLACE_WITH_YOUR_BREEZE_API_KEY
    mode: realtime
    # clever = 大肥鱼·机灵（voc_u3nxkd5578wc），dreamy = 大肥鱼·迷糊（voc_8yud7hz7c9q2），也可直接填 voc_ 开头的 ID
    voice_id: clever
    language_code: zh
    # 语速只在 http 模式生效；不等于 1.0 时自动使用 http
    speed: 1.0
    # 音量倍数（0.01–2.0），只在 level: false 时使用
    volume: 1.5
    # 自动拉平响度（默认开）：每句话按实际响度调到和本地合成一样（-20 dBFS），峰值软限幅不爆音
    level: true
    # 可选：用中文描述语气
    instructions: "语气平稳自然、温和亲切，像平常聊天；不要惊呼，不要夸张的起伏"
    # 为 false 时请求附带 enable_logging=false（服务方仍会保留文本用于运营与风控）
    enable_logging: false
    # 实时连接空闲多久后关闭（秒）
    idle_keep_s: 120
    # 同时进行的合成请求数。免费档账号只允许 1 个；排队中的后续句子会合并成一次请求
    max_concurrency: 1
    # 上句播放前先缓冲的音频秒数，用于掩盖下一次请求的网络延迟
    prebuffer_s: 1.0
    fallback_local: true
    output_dir: tmp/
