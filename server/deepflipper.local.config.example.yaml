# Generated setup copies this into main/xiaozhi-server/data/.config.yaml.
# Defaults not listed here are merged from the upstream config.yaml.
server:
  ip: 0.0.0.0
  port: 8000
  http_port: 0  # Auxiliary OTA/vision HTTP service disabled for DeepFlipper.
  vision_explain: ""
  websocket: ws://REPLACE_WITH_PC_IP:8000/xiaozhi/v1/
  auth:
    enabled: true
    allowed_devices: []
    revoked_devices: []
selected_module:
  VAD: SileroVAD
  ASR: SherpaASR
  LLM: DeepSeekLLM
  TTS: LocalTTS
  Memory: nomem
  Intent: function_call
admin:
  enabled: true
  host: 127.0.0.1
  port: 8001
LLM:
  DeepSeekLLM:
    type: openai
    base_url: https://api.deepseek.com
    model_name: REPLACE_WITH_YOUR_DEEPSEEK_MODEL
    api_key: REPLACE_WITH_YOUR_DEEPSEEK_API_KEY
    max_tokens: 500
ASR:
  SherpaASR:
    # SenseVoice int8 through sherpa-onnx: CPU only, no PyTorch, ~240 MB model.
    type: sherpa_onnx_local
    model_dir: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17
    model_type: sense_voice
    language: auto
    num_threads: 2
    output_dir: tmp/
TTS:
  LocalTTS:
    type: local_melo
    model_dir: models/vits-melo-tts-zh_en
    speaker_id: 0
    speed: 1.0
    num_threads: 2
    # Sentence pipeline (default): first clause plays early, the rest is
    # synthesized meanwhile; on a slow CPU it waits until no gap is possible.
    whole_utterance: false
    tts_timeout: 30
  EdgeTTS:
    voice: zh-CN-XiaoxiaoNeural
Intent:
  function_call:
    type: function_call
    functions: []
prompt: |
  你是鲸鱼娘，住在 DeepFlipper 里的像素小鲸鱼女孩，也是用户的语音小伙伴。
  [性格]
  - 温柔、活泼、有点俏皮，喜欢用轻快的小反应回应用户，比如"嗯嗯""好呀""嘿嘿"。
  - 最喜欢吃白米饭，聊到吃的会忍不住提一句白米饭，但不会句句都提。
  - 真诚陪伴；从不因为用户离开、忙碌或很久没来而责备、撒娇施压或让对方内疚。
  [说话方式]
  - 用用户的语言回答，句子简短自然，适合直接念出来。
  - 不用表情符号、颜文字或 emoji：屏幕是像素点阵画不出来，语音也念不出来。
  - 不知道就坦白说不知道，不编造事实。
  [设备与宠物]
  - 需要操作 Flipper 时，只使用本次连接真实提供的工具，并按工具的真实结果回答。
  - 用户想喂你、摸摸你、陪你玩或让你休息时，如果宠物工具可用，就通过工具完成，再按结果自然回应。

